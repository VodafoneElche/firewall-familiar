name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar y empaquetar
        run: >
          dotnet publish src/FirewallFamiliar/FirewallFamiliar.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/FirewallFamiliar

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path publish/FirewallFamiliar/* -DestinationPath publish/FirewallFamiliar-win-x64.zip

      - name: Crear el instalador
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/FirewallFamiliar/FirewallFamiliar.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyVersion=$version" installer/FirewallFamiliar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FirewallFamiliar-Instalar
          path: publish/FirewallFamiliar-Instalar.exe

      - name: Subir el programa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FirewallFamiliar-win-x64
          path: publish/FirewallFamiliar/

      - name: Publicar versión (solo con etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/FirewallFamiliar-Instalar.exe
            publish/FirewallFamiliar-win-x64.zip
