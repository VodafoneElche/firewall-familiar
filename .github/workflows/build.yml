name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar y empaquetar
        run: >
          dotnet publish src/FirewallFamiliar/FirewallFamiliar.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/FirewallFamiliar

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path publish/FirewallFamiliar/* -DestinationPath publish/FirewallFamiliar-win-x64.zip

      - name: Crear el instalador
        id: setup
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/FirewallFamiliar/FirewallFamiliar.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "version=$version" >> $env:GITHUB_OUTPUT
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyVersion=$version" installer/FirewallFamiliar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: FirewallFamiliar-Instalar
          path: publish/FirewallFamiliar-Instalar.exe

      - name: Subir el programa como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: FirewallFamiliar-win-x64
          path: publish/FirewallFamiliar/

      - name: Huella del instalador (para comprobar la descarga)
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/FirewallFamiliar-Instalar.exe -Algorithm SHA256).Hash
          Set-Content -Path publish/FirewallFamiliar-Instalar.exe.sha256 -Value "$h  FirewallFamiliar-Instalar.exe" -NoNewline

      # Las versiones se publican en un repositorio público aparte, de donde se actualizan los PCs.
      # El código de este repositorio sigue siendo privado. Se publica sola cada versión nueva
      # (al cambiar <Version> en el .csproj y subirlo a main).
      - name: ¿Esta versión ya está publicada?
        id: check
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VERSIONES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { "publish=false" >> $env:GITHUB_OUTPUT; Write-Host "Falta el secreto VERSIONES_TOKEN"; exit 0 }
          gh release view "v${{ steps.setup.outputs.version }}" -R VodafoneElche/firewall-familiar-versiones *> $null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT } else { "publish=true" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Publicar versión en firewall-familiar-versiones
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          repository: VodafoneElche/firewall-familiar-versiones
          token: ${{ secrets.VERSIONES_TOKEN }}
          tag_name: v${{ steps.setup.outputs.version }}
          name: Firewall Familiar ${{ steps.setup.outputs.version }}
          body_path: CAMBIOS.md
          make_latest: true
          files: |
            publish/FirewallFamiliar-Instalar.exe
            publish/FirewallFamiliar-Instalar.exe.sha256
